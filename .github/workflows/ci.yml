name: CI

# Compiles the app on GitHub's macOS runners.
#
# This exists because the Swift here was written on a machine with no Xcode and no Apple
# frameworks, so nothing local can tell whether it builds. A runner can, which turns "unverified
# until someone opens it on a Mac" into a check that runs on every push.
#
# Simulator build only: no signing, no certificates, no Apple Developer account needed. Getting
# the app onto a real iPad still needs a Mac and a signing identity — this proves the code
# compiles, not that it installs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15

    # A ceiling, not a target — this build takes a few minutes, so 30 is only ever
    # reached by something stuck. GitHub's default is 360, and macOS minutes bill at
    # 10x, so ONE hung job on this runner is 3,600 minutes: nearly two months of a
    # Free plan's 2,000-minute allowance, gone silently while the job looks busy.
    # That does not bill today because this repository is public and public repos get
    # unlimited free minutes — which is exactly why the cap belongs here now rather
    # than in the incident report if it is ever made private again.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project MyHumans.xcodeproj \
            -scheme MyHumans \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  # The bridge's TypeScript half used to live in web/ here and be tested by this job.
  # It moved to lib/native/ in the myhumansapp repo (PR #254 there) — which was always the
  # plan — and its tests run in that repo's CI now. One source of truth, not a mirror that
  # drifts.
